services:
  db:
    image: postgres:16-alpine
    container_name: toca_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: toca_espanhol
      POSTGRES_USER: tocauser
      POSTGRES_PASSWORD: toca123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tocauser -d toca_espanhol"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: toca_backend
    restart: unless-stopped
    # Credenciais e chaves vêm do .env; só sobrescrevemos o que muda no Docker.
    env_file:
      - ./backend/.env
    environment:
      # Ambiente de DESENVOLVIMENTO (usuários de demonstração com senha 123456).
      # Produção: deploy/docker-compose.prod.yml.
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DB_HOST: db
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://frontend
    volumes:
      - ./backend:/app
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py seed_data &&
        python manage.py seed_menu &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: toca_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  static_files:
