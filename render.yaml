# Render Blueprint — https://render.com/docs/blueprint-spec
# Cria: backend Django (web/Python) + frontend (static site).
# O PostgreSQL roda na VM Oracle (fora do Render); defina DATABASE_URL no dashboard.
# Só as env vars marcadas com "sync: false" precisam ser preenchidas.

services:
  # ─────────────────────────────── BACKEND ───────────────────────────────
  - type: web
    name: toca-do-espanhol-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py seed_data && python manage.py seed_menu --if-empty"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Postgres na VM Oracle — ex.: postgres://toca:SENHA@IP_DA_VM:5432/toca_espanhol?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        value: "False"
      - key: JWT_ACCESS_LIFETIME_MIN
        value: "15"
      - key: JWT_REFRESH_LIFETIME_DAYS
        value: "7"
      # Definidas manualmente no dashboard (sync: false):
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS          # ex.: toca-do-espanhol-api.onrender.com
        sync: false
      - key: CORS_ALLOWED_ORIGINS   # ex.: https://toca-do-espanhol-web.onrender.com
        sync: false

  # ─────────────────────────────── FRONTEND ──────────────────────────────
  - type: web
    name: toca-do-espanhol-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    # SPA: qualquer rota cai no index.html (React Router)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Build-time (Vite inlina). ex.: https://toca-do-espanhol-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
